name: Real signal recording
on:
  workflow_call:
    inputs:
      build_cache_artifact:
        description: Portable build cache artifact from the calling CI run.
        required: false
        type: string
        default: ""
      remote_cache_write:
        description: Trusted release qualification may publish the remote cache.
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        description: Remote cache token. Only trusted callers pass it.
        required: false
  workflow_dispatch:

env:
  HUSKY: "0"
  # A called workflow sees the caller event, so workflow_call is not an event
  # name here. Writes when remote_cache_write is set, or on the default branch
  # for push, schedule, and manual dispatch. Open pull requests stay empty-token
  # and use the local cache only.
  TURBO_TOKEN: "${{ (inputs.remote_cache_write == true || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && secrets.TURBO_TOKEN || '' }}"
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE: "${{ (inputs.remote_cache_write == true || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'local:rw,remote:rw' || 'local:rw' }}"

permissions:
  contents: read
jobs:
  sigrok:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Cache npm package downloads
        id: npm-cache
        uses: ./.github/actions/npm-cache
      - run: sudo apt-get update && sudo apt-get install -y sigrok-cli util-linux python3
      - run: npm ci
      - uses: ./.github/actions/portable-build-cache
        with:
          build_cache_artifact: ${{ inputs.build_cache_artifact }}
      - run: npm run build:cached
      - name: Run focused tests and require Linux resource and cleanup cases
        run: |
          report=".cache/rea-signal-required-tests.json"
          mkdir -p .cache
          rm -f "$report"
          node tooling/run-exact-tests.mjs run --reporter=default --reporter=json --outputFile.json="$report" \
            spec/boundary/signals/decoderDiscovery.test.ts core/process/LinuxResourceLimits.test.ts core/domain/signals/annotationTextWindow.test.ts spec/boundary/signals/recordingProvider.test.ts spec/boundary/signals/recordingDescriptorCleanup.test.ts spec/boundary/signals/resourceLimits.test.ts spec/boundary/mcp/signalRecordingMcp.test.ts spec/boundary/cli/signalCleanup.test.ts
          node tooling/ci/require-provider-tests.mjs signal "$report"
      - run: node tooling/verify-signal-recording.mjs
        env:
          REA_SIGROK_COMMAND: /usr/bin/sigrok-cli
